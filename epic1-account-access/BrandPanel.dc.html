<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FridgeWise – Brand panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; height: 100%; min-height: 852px; border-radius: 36px; background: #A8DDB5; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px 48px; font-family: 'Nunito', system-ui, sans-serif; color: #3D3533">
  <div aria-hidden="true" style="position: absolute; top: -90px; right: -90px; width: 280px; height: 280px; border-radius: 50%; background: #FFE28A"></div>
  <div aria-hidden="true" style="position: absolute; bottom: 150px; left: -70px; width: 180px; height: 180px; border-radius: 50%; background: #C9B9F2; opacity: 0.75"></div>
  <div aria-hidden="true" style="position: absolute; top: 210px; right: 56px; width: 18px; height: 18px; border-radius: 50%; background: #FF7F79"></div>
  <div aria-hidden="true" style="position: absolute; top: 120px; left: 120px; width: 12px; height: 12px; border-radius: 50%; background: #FFA552"></div>
  <div aria-hidden="true" style="position: absolute; bottom: 260px; right: 120px; width: 14px; height: 14px; border-radius: 50%; background: #A9D8F0"></div>

  <div style="position: relative; align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 12px; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 800">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F7A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>
    {{tag}}
  </div>

  <div aria-hidden="true" style="position: relative; height: 440px; margin: 16px 0">
    <svg width="240" height="400" viewBox="0 0 240 400" fill="none" stroke="#3D3533" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 50%; top: 16px; margin-left: -120px">
      <rect x="8" y="8" width="224" height="384" rx="32" fill="#FFFFFF"></rect>
      <path d="M8 120h224"></path>
      <rect x="28" y="44" width="10" height="48" rx="5" fill="#3D3533"></rect>
      <circle cx="192" cy="58" r="13" fill="#FFE28A" stroke-width="3"></circle>
      <circle cx="166" cy="86" r="8" fill="#FF7F79" stroke-width="3"></circle>
      <rect x="24" y="136" width="192" height="240" rx="18" fill="#FFF9F0" stroke-width="3"></rect>
      <path d="M24 216h192" stroke-width="3"></path>
      <path d="M24 296h192" stroke-width="3"></path>
      <path d="M44 158l8-14h18l8 14v56H44z" fill="#A9D8F0" stroke-width="3"></path>
      <path d="M44 172h34" stroke-width="3"></path>
      <ellipse cx="100" cy="200" rx="10" ry="13" fill="#FFFFFF" stroke-width="3"></ellipse>
      <ellipse cx="122" cy="200" rx="10" ry="13" fill="#FFFFFF" stroke-width="3"></ellipse>
      <rect x="148" y="172" width="38" height="42" rx="8" fill="#C9B9F2" stroke-width="3"></rect>
      <rect x="144" y="162" width="46" height="12" rx="4" fill="#FFA552" stroke-width="3"></rect>
      <circle cx="62" cy="273" r="20" fill="#FF7F79" stroke-width="3"></circle>
      <path d="M55 253c4-6 10-6 14 0" fill="#A8DDB5" stroke-width="3"></path>
      <circle cx="101" cy="279" r="14" fill="#FF7F79" stroke-width="3"></circle>
      <path d="M134 294h62v-36z" fill="#FFE28A" stroke-width="3"></path>
      <circle cx="176" cy="282" r="4" fill="#FFF9F0" stroke-width="2.5"></circle>
      <circle cx="188" cy="272" r="3" fill="#FFF9F0" stroke-width="2.5"></circle>
      <circle cx="62" cy="350" r="22" fill="#A8DDB5" stroke-width="3"></circle>
      <path d="M52 350c4-8 16-8 20 0" stroke-width="3"></path>
      <path d="M106 354l62-16-58 30z" fill="#FFA552" stroke-width="3"></path>
      <path d="M100 350l-10-8" stroke="#2F7A4A" stroke-width="3"></path>
      <path d="M101 357l-12 2" stroke="#2F7A4A" stroke-width="3"></path>
    </svg>

    <div style="position: absolute; left: 0; top: 40px; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 14px 28px rgba(61, 53, 51, 0.14)">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #A9D8F0; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8v3l2 3v14H6V8l2-3z"></path><path d="M6 12h12"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; font-weight: 800">Milk, 1 L</span>
        <span style="align-self: flex-start; display: flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; background: #FFE28A; font-size: 12px; font-weight: 800">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          Use in 2 days
        </span>
      </div>
    </div>

    <div style="position: absolute; right: 0; top: 170px; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 14px 28px rgba(61, 53, 51, 0.14)">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #FFE3E1; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="7"></circle><path d="M12 7c0-2 1-3 3-4"></path><path d="M9 7.5l3 1.5 3-1.5"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; font-weight: 800">Tomatoes, 6</span>
        <span style="align-self: flex-start; display: flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; background: #D6F0DC; font-size: 12px; font-weight: 800">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          Fresh
        </span>
      </div>
    </div>

    <div style="position: absolute; left: 24px; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 14px 28px rgba(61, 53, 51, 0.14)">
      <div style="position: relative; width: 44px; height: 44px; border-radius: 14px; background: #C9B9F2; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: -4px; right: -4px; width: 14px; height: 14px; border-radius: 50%; background: #FF7F79; border: 2px solid #FFFFFF"></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 800">3 items to use this week</span>
        <span style="font-size: 13px; font-weight: 600; color: #6B6663">2 recipes can use them up</span>
      </div>
    </div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 12px; max-width: 520px">
    <h2 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 46px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">{{headline}}</h2>
    <p style="margin: 0; font-size: 18px; line-height: 1.55; font-weight: 600">{{sub}}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["signin","signup","reset","code","done"],"default":"signin"},"$preview":{"width":680,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const copy = {
      signin: { tag: 'Made for shared kitchens', headline: 'Your kitchen, your little food universe.', sub: "See what's fresh, what's expiring and what you can cook tonight." },
      signup: { tag: 'One account each, one shared kitchen', headline: 'Hey, Chef! Pull up a chair.', sub: 'Track groceries with your housemates, get a nudge before food goes off, and waste less together.' },
      reset: { tag: 'Account help', headline: 'Happens to the best chefs.', sub: "We'll email you a 6-digit code and get you back to your kitchen in a minute." },
      code: { tag: 'Account help', headline: 'Almost there!', sub: 'Grab the code from your inbox. Your groceries are right where you left them.' },
      done: { tag: 'All sorted', headline: 'Back in business!', sub: 'Your fridge missed you. Sign in and pick up where you left off.' }
    };
    return copy[this.props.variant] || copy.signin;
  }
}
</script>
</body>
</html>
