<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FridgeWise – Forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3533;text-decoration-color:#FF7F79;text-decoration-thickness:2px;text-underline-offset:3px}a:hover{color:#000000}
:focus-visible{outline:3px solid #3D3533;outline-offset:3px}
.fw-btn{transition:transform .12s ease, box-shadow .12s ease}
.fw-btn:active{transform:translateY(4px);box-shadow:none !important}
.fw-input:focus{border-color:#3D3533 !important;box-shadow:0 0 0 4px #FFE3E1;outline:none}
@media (max-width: 900px){.fw-aside{display:none !important}}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; background: #FFF9F0; font-family: 'Nunito', system-ui, sans-serif; color: #3D3533">
  <main style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; padding: 8px clamp(0px, 3vw, 40px)">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #FF7F79; box-shadow: 0 3px 0 #D9524C; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M6 10h12"></path><path d="M9.5 5v2"></path><path d="M9.5 13v3"></path></svg>
      </span>
      <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; line-height: 1">FridgeWise</span>
    </div>

    <div style="flex-grow: 1; display: flex; align-items: center; padding: 32px 0">
      <div style="width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column">
        <a href="Main.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px 0 10px; margin-left: -10px; border-radius: 999px; font-size: 15px; font-weight: 800; text-decoration: none">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          Back to sign in
        </a>

        <div style="margin-top: 24px; width: 72px; height: 72px; border-radius: 24px; background: #FFE28A; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="M10.7 12.3L20 3"></path><path d="M16 7l3 3"></path><path d="M13.5 9.5l2.5 2.5"></path></svg>
        </div>

        <h1 style="margin: 24px 0 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">Forgot your password?</h1>
        <p style="margin: 8px 0 0; font-size: 17px; line-height: 1.55; color: #6B6663">No worries. Enter the email you signed up with and we'll send you a 6-digit code.</p>

        <form style="margin: 32px 0 0; display: flex; flex-direction: column; gap: 24px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="email" style="font-size: 15px; font-weight: 800">Email</label>
            <input id="email" class="fw-input" type="email" autocomplete="email" value="sara@example.com" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 20px; border: 2px solid #3D3533; box-shadow: 0 0 0 4px #FFE3E1; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #3D3533">
          </div>
          <a href="VerifyCode.dc.html" class="fw-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border-radius: 999px; background: #FF7F79; box-shadow: 0 4px 0 #D9524C; color: #3D3533; font-size: 17px; font-weight: 800; text-decoration: none">
            Send code
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
          </a>
        </form>

        <p style="margin: 24px 0 0; text-align: center; font-size: 15px; color: #6B6663">Remembered it? <a href="Main.dc.html" style="font-weight: 800">Sign in</a></p>
      </div>
    </div>
  </main>

  <aside class="fw-aside" style="flex: 1 1 520px; min-width: 0; display: flex">
    <dc-import name="BrandPanel" variant="reset" hint-size="100%,852px"></dc-import>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
