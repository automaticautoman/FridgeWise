<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FridgeWise – Set a new password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3533;text-decoration-color:#FF7F79;text-decoration-thickness:2px;text-underline-offset:3px}a:hover{color:#000000}
:focus-visible{outline:3px solid #3D3533;outline-offset:3px}
.fw-btn{transition:transform .12s ease, box-shadow .12s ease}
.fw-btn:active{transform:translateY(4px);box-shadow:none !important}
.fw-input:focus{border-color:#3D3533 !important;box-shadow:0 0 0 4px #FFE3E1;outline:none}
@media (max-width: 900px){.fw-aside{display:none !important}}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; background: #FFF9F0; font-family: 'Nunito', system-ui, sans-serif; color: #3D3533">
  <main style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; padding: 8px clamp(0px, 3vw, 40px)">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #FF7F79; box-shadow: 0 3px 0 #D9524C; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M6 10h12"></path><path d="M9.5 5v2"></path><path d="M9.5 13v3"></path></svg>
        </span>
        <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; line-height: 1">FridgeWise</span>
      </div>
      <a href="Main.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 4px; font-size: 15px; font-weight: 800">Cancel</a>
    </div>

    <div style="flex-grow: 1; display: flex; align-items: center; padding: 24px 0">
      <div style="width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 8px; align-self: flex-start; padding: 6px 14px 6px 8px; border-radius: 999px; background: #D6F0DC; font-size: 14px; font-weight: 800">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F7A4A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          Code verified
        </div>

        <h1 style="margin: 20px 0 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">Set a new password</h1>
        <p style="margin: 8px 0 0; font-size: 17px; line-height: 1.55; color: #6B6663">Pick something you don't use anywhere else.</p>

        <form style="margin: 28px 0 0; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="new-password" style="font-size: 15px; font-weight: 800">New password</label>
            <div style="position: relative">
              <input id="new-password" class="fw-input" type="password" autocomplete="new-password" aria-describedby="pw-rules" value="chaiTime2026" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 60px 0 20px; border: 1.5px solid #898582; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #3D3533">
              <button type="button" aria-label="Show password" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #6B6663; cursor: pointer">
                <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <ul id="pw-rules" style="margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px">
              <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: 999px; background: #D6F0DC; font-size: 13px; font-weight: 800">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F7A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                8+ characters
              </li>
              <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: 999px; background: #D6F0DC; font-size: 13px; font-weight: 800">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F7A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                A letter
              </li>
              <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: 999px; background: #D6F0DC; font-size: 13px; font-weight: 800">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F7A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                A number
              </li>
            </ul>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="confirm-password" style="font-size: 15px; font-weight: 800">Confirm new password</label>
            <div style="position: relative">
              <input id="confirm-password" class="fw-input" type="password" autocomplete="new-password" aria-describedby="match-ok" value="chaiTime2026" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 60px 0 20px; border: 2px solid #3D3533; box-shadow: 0 0 0 4px #FFE3E1; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #3D3533">
              <button type="button" aria-label="Show password" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #6B6663; cursor: pointer">
                <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <p id="match-ok" style="margin: 4px 0 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: #2F7A4A">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.8 2.8L16.5 9.5"></path></svg>
              Passwords match
            </p>
          </div>
          <a href="ResetDone.dc.html" class="fw-btn" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 999px; background: #FF7F79; box-shadow: 0 4px 0 #D9524C; color: #3D3533; font-size: 17px; font-weight: 800; text-decoration: none">Save password</a>
        </form>
      </div>
    </div>
  </main>

  <aside class="fw-aside" style="flex: 1 1 520px; min-width: 0; display: flex">
    <dc-import name="BrandPanel" variant="code" hint-size="100%,852px"></dc-import>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
