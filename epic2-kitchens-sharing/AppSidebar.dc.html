<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FridgeWise – App sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="box-sizing: border-box; width: 100%; height: 100%; min-height: 852px; background: #FFFFFF; border-radius: 28px; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; box-shadow: 0 12px 32px rgba(61, 53, 51, 0.06); font-family: 'Nunito', system-ui, sans-serif; color: #3D3533">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
    <span style="width: 40px; height: 40px; border-radius: 13px; background: #FF7F79; box-shadow: 0 3px 0 #D9524C; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M6 10h12"></path><path d="M9.5 5v2"></path><path d="M9.5 13v3"></path></svg>
    </span>
    <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 25px; font-weight: 800; line-height: 1">FridgeWise</span>
  </div>

  <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px">
    <li><a href="#" aria-current="{{cur.home}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 16px; color: #3D3533; text-decoration: none; font-size: 15px; font-weight: {{fw.home}}; background: {{bg.home}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>
      Home</a></li>
    <li><a href="Main.dc.html" aria-current="{{cur.kitchen}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 16px; color: #3D3533; text-decoration: none; font-size: 15px; font-weight: {{fw.kitchen}}; background: {{bg.kitchen}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"></rect><path d="M5 10h14"></path><path d="M9 5v2"></path><path d="M9 13v3"></path></svg>
      My Kitchen</a></li>
    <li><a href="#" aria-current="{{cur.expiry}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 16px; color: #3D3533; text-decoration: none; font-size: 15px; font-weight: {{fw.expiry}}; background: {{bg.expiry}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M10 2h4"></path></svg>
      Expiry Tracker</a></li>
    <li><a href="#" aria-current="{{cur.recipes}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 16px; color: #3D3533; text-decoration: none; font-size: 15px; font-weight: {{fw.recipes}}; background: {{bg.recipes}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.9A4 4 0 0 1 7.4 6a5 5 0 0 1 9.2 0A4 4 0 0 1 18 13.9V21H6z"></path><path d="M6 17h12"></path></svg>
      Discover Recipes</a></li>
    <li><a href="#" aria-current="{{cur.shopping}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 16px; color: #3D3533; text-decoration: none; font-size: 15px; font-weight: {{fw.shopping}}; background: {{bg.shopping}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="20.5" r="1.5"></circle><circle cx="18" cy="20.5" r="1.5"></circle><path d="M2 3h2.5l2.6 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.5L21.5 8H5.6"></path></svg>
      Shopping List</a></li>
    <li><a href="#" aria-current="{{cur.notifications}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 16px; color: #3D3533; text-decoration: none; font-size: 15px; font-weight: {{fw.notifications}}; background: {{bg.notifications}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      Notifications</a></li>
    <li><a href="#" aria-current="{{cur.settings}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 16px; color: #3D3533; text-decoration: none; font-size: 15px; font-weight: {{fw.settings}}; background: {{bg.settings}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      Profile &amp; Settings</a></li>
  </ul>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 20px; background: #FFF9F0">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: {{avatarBg}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">{{initials}}</span>
      <div style="min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 15px; font-weight: 800">{{userName}}</span>
        <span style="font-size: 13px; color: #6B6663; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{kitchenLabel}}</span>
      </div>
    </div>
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #898582; color: #3D3533; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
      Sign out
    </button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","kitchen","expiry","recipes","shopping","notifications","settings"],"default":"kitchen"},"userName":{"editor":null,"default":"Sara Khan"},"initials":{"editor":null,"default":"SK"},"kitchenLabel":{"editor":null,"default":"Room 4B kitchen"},"avatarBg":{"editor":null,"default":"#FFE28A"},"$preview":{"width":264,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'kitchen';
    const keys = ['home', 'kitchen', 'expiry', 'recipes', 'shopping', 'notifications', 'settings'];
    const bg = {}, fw = {}, cur = {};
    keys.forEach((k) => {
      bg[k] = k === active ? '#FFE3E1' : 'transparent';
      fw[k] = k === active ? '800' : '700';
      cur[k] = k === active ? 'page' : undefined;
    });
    return {
      bg, fw, cur,
      userName: this.props.userName ?? 'Sara Khan',
      initials: this.props.initials ?? 'SK',
      kitchenLabel: this.props.kitchenLabel ?? 'Room 4B kitchen',
      avatarBg: this.props.avatarBg ?? '#FFE28A'
    };
  }
}
</script>
</body>
</html>
