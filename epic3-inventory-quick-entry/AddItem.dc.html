<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FridgeWise – Add item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3533;text-decoration-color:#FF7F79;text-decoration-thickness:2px;text-underline-offset:3px}a:hover{color:#000000}
:focus-visible{outline:3px solid #3D3533;outline-offset:3px}
.fw-btn{transition:transform .12s ease, box-shadow .12s ease}
.fw-btn:active{transform:translateY(4px);box-shadow:none !important}
.fw-chip:hover{background:#FFF4F3 !important}
@media (max-width: 900px){.fw-side{display:none !important}}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 24px; display: flex; flex-wrap: wrap; gap: 32px; background: #FFF9F0; font-family: 'Nunito', system-ui, sans-serif; color: #3D3533">
  <div class="fw-side" style="flex: 0 0 264px; display: flex">
    <dc-import name="AppSidebar" active="kitchen" hint-size="264px,852px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; max-width: 1080px; padding: 16px 8px 24px; display: flex; flex-direction: column; align-items: center">
    <div style="width: 100%; max-width: 680px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px 0 4px; font-size: 15px; font-weight: 800; text-decoration: none">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          Home
        </a>
        <a href="QuickAdd.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #898582; font-size: 14px; font-weight: 800; text-decoration: none">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          Add lots at once
        </a>
      </div>

      <h1 style="margin: 12px 0 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">What did you get?</h1>

      <div style="margin-top: 20px; position: relative">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6663" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 20px; top: 19px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <label for="q" style="position: absolute; left: -9999px">Search items</label>
        <input id="q" type="search" value="mi" autocomplete="off" style="width: 100%; height: 60px; box-sizing: border-box; padding: 0 20px 0 54px; border: 2px solid #3D3533; box-shadow: 0 0 0 4px #FFE3E1; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700; color: #3D3533">
      </div>

      <section aria-labelledby="rec-h" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 id="rec-h" style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #6B6663">You often add</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{recent}}" as="c" hint-placeholder-count="6">
            <button type="button" class="fw-chip" onClick="{{c.add}}" aria-label="{{c.aria}}" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px 0 12px; border-radius: 999px; background: {{c.bg}}; border: 1.5px solid {{c.border}}; color: #3D3533; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">
              <span aria-hidden="true" style="font-size: 18px; line-height: 1">{{c.mark}}</span>
              {{c.name}}
            </button>
          </sc-for>
        </div>
      </section>

      <section aria-labelledby="res-h" style="margin-top: 24px; padding: 12px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 12px 32px rgba(61, 53, 51, 0.06); display: flex; flex-direction: column; gap: 4px">
        <h2 id="res-h" style="margin: 6px 10px 8px; font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #6B6663">4 matches for “mi”</h2>
        <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 18px; background: {{r.rowBg}}">
            <span aria-hidden="true" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px; background: {{r.tile}}; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{r.initial}}</span>
            <span style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 800">{{r.name}}</span>
              <span style="font-size: 13px; color: #6B6663">{{r.meta}}</span>
            </span>
            <a href="ItemForm.dc.html" style="flex-shrink: 0; padding: 10px 8px; font-size: 14px; font-weight: 800">Details</a>
            <sc-if value="{{r.added}}" hint-placeholder-val="{{false}}">
              <button type="button" onClick="{{r.undo}}" style="flex-shrink: 0; width: 112px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; background: #D6F0DC; border: none; color: #1F5E37; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                Undo
              </button>
            </sc-if>
            <sc-if value="{{r.notAdded}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{r.add}}" aria-label="Add {{r.name}}" class="fw-btn" style="flex-shrink: 0; width: 112px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 999px; background: #FF7F79; box-shadow: 0 3px 0 #D9524C; color: #3D3533; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                Add
              </button>
            </sc-if>
          </div>
        </sc-for>
        <a href="AddCustom.dc.html" style="margin: 4px 10px 6px; padding: 8px 0; font-size: 14px; font-weight: 800">Not what you're looking for? Create your own item</a>
      </section>

      <p style="margin: 16px 4px 0; font-size: 14px; line-height: 1.5; color: #6B6663">Add puts it in its usual spot with its usual amount and shelf life. Tap Details to change anything.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const added = (this.state && this.state.added) || {};
    const set = (k, v) => this.setState({ added: Object.assign({}, added, { [k]: v }) });
    const recent = ['Eggs', 'Milk', 'Bread', 'Onions', 'Chicken', 'Yoghurt'].map((n) => {
      const on = !!added['r-' + n];
      return {
        name: n, mark: on ? '✓' : '+', aria: on ? n + ' added' : 'Add ' + n,
        bg: on ? '#D6F0DC' : '#FFFFFF', border: on ? '#2F7A4A' : '#898582',
        add: () => set('r-' + n, !on)
      };
    });
    const data = [
      { name: 'Milk', meta: 'Dairy · Fridge · 1 L · keeps about 7 days', tile: '#A9D8F0' },
      { name: 'Mint', meta: 'Herbs · Fridge · 1 bunch · keeps about 5 days', tile: '#A8DDB5' },
      { name: 'Green chillies (mirchi)', meta: 'Vegetables · Fridge · 250 g · keeps about 7 days', tile: '#A8DDB5' },
      { name: 'Milk powder', meta: 'Dairy · Pantry · 400 g · keeps about 6 months', tile: '#FFE28A' }
    ];
    const results = data.map((d) => {
      const on = !!added['s-' + d.name];
      return Object.assign({}, d, {
        initial: d.name.charAt(0),
        added: on, notAdded: !on,
        rowBg: on ? '#EAF7EE' : 'transparent',
        add: () => set('s-' + d.name, true),
        undo: () => set('s-' + d.name, false)
      });
    });
    return { recent, results };
  }
}
</script>
</body>
</html>
