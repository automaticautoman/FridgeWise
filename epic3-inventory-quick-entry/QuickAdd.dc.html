<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FridgeWise – Quick-add after shopping</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3533;text-decoration-color:#FF7F79;text-decoration-thickness:2px;text-underline-offset:3px}a:hover{color:#000000}
:focus-visible{outline:3px solid #3D3533;outline-offset:3px}
.fw-btn{transition:transform .12s ease, box-shadow .12s ease}
.fw-btn:active{transform:translateY(4px);box-shadow:none !important}
.fw-step:hover{background:#F3ECE4 !important}
.fw-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width: 900px){.fw-side{display:none !important}}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 24px; display: flex; flex-wrap: wrap; gap: 32px; background: #FFF9F0; font-family: 'Nunito', system-ui, sans-serif; color: #3D3533">
  <div class="fw-side" style="flex: 0 0 264px; display: flex">
    <dc-import name="AppSidebar" active="kitchen" hint-size="264px,852px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; max-width: 1080px; padding: 16px 8px 24px; display: flex; flex-direction: column; align-items: center">
    <div style="width: 100%; max-width: 680px; display: flex; flex-direction: column">
      <a href="AddItem.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px 0 4px; font-size: 15px; font-weight: 800; text-decoration: none">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        Back
      </a>
      <h1 style="margin: 12px 0 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">Back from the shop?</h1>
      <p style="margin: 8px 0 0; font-size: 17px; line-height: 1.55; color: #6B6663">Tick what you bought and add it all in one go.</p>

      <section aria-label="Items" style="margin-top: 24px; padding: 10px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 12px 32px rgba(61, 53, 51, 0.06); display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 6px 10px; border-radius: 16px; background: {{r.rowBg}}">
            <label style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 14px; min-height: 48px; cursor: pointer">
              <input type="checkbox" checked="{{r.on}}" onChange="{{r.toggle}}" class="fw-sr">
              <span aria-hidden="true" style="flex-shrink: 0; width: 28px; height: 28px; box-sizing: border-box; border-radius: 9px; border: {{r.boxBorder}}; background: {{r.boxBg}}; display: flex; align-items: center; justify-content: center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{r.tick}}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              </span>
              <span style="display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 16px; font-weight: 800">{{r.name}}</span>
                <span style="font-size: 13px; color: #6B6663">{{r.each}} · {{r.loc}}</span>
              </span>
            </label>
            <sc-if value="{{r.on}}" hint-placeholder-val="{{false}}">
              <div role="group" aria-label="{{r.qtyLabel}}" style="flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #D9D2CB">
                <button type="button" class="fw-step" aria-label="Fewer" onClick="{{r.dec}}" style="width: 40px; height: 40px; border: none; border-radius: 50%; background: transparent; color: #3D3533; font-size: 20px; font-weight: 800; cursor: pointer">−</button>
                <span style="min-width: 36px; text-align: center; font-size: 15px; font-weight: 800">×{{r.qty}}</span>
                <button type="button" class="fw-step" aria-label="More" onClick="{{r.inc}}" style="width: 40px; height: 40px; border: none; border-radius: 50%; background: transparent; color: #3D3533; font-size: 20px; font-weight: 800; cursor: pointer">+</button>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <a href="AddItem.dc.html" style="margin: 6px 10px; padding: 8px 0; font-size: 14px; font-weight: 800">Bought something else? Search for it</a>
      </section>

      <div style="position: sticky; bottom: 16px; margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 14px 14px 22px; border-radius: 999px; background: #3D3533; color: #FFFFFF; box-shadow: 0 18px 36px rgba(61, 53, 51, 0.25)">
        <span style="font-size: 15px; font-weight: 700">{{summary}}</span>
        <a href="Main.dc.html" class="fw-btn" style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 26px; border-radius: 999px; background: #FF7F79; box-shadow: 0 4px 0 #D9524C; color: #3D3533; font-size: 16px; font-weight: 800; text-decoration: none">{{cta}}</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || { Milk: 2, Eggs: 1, Bread: 1, Onions: 1, Tomatoes: 1 };
    const data = [
      ['Milk', '1 L', 'Fridge'], ['Eggs', '12 pieces', 'Fridge'], ['Bread', '1 loaf', 'Cupboard'],
      ['Onions', '1 kg', 'Pantry'], ['Tomatoes', '1 kg', 'Fridge'], ['Chicken', '1 kg', 'Fridge'],
      ['Yoghurt', '500 g', 'Fridge'], ['Potatoes', '2 kg', 'Pantry']
    ];
    const upd = (n, v) => {
      const next = Object.assign({}, sel);
      if (v > 0) next[n] = v; else delete next[n];
      this.setState({ sel: next });
    };
    const rows = data.map(([name, each, loc]) => {
      const q = sel[name] || 0;
      const on = q > 0;
      return {
        name, each, loc, on, qty: q,
        qtyLabel: 'How many ' + name,
        rowBg: on ? '#FFF4F3' : 'transparent',
        boxBorder: on ? 'none' : '2px solid #898582',
        boxBg: on ? '#3D3533' : '#FFFFFF',
        tick: on ? '#FFFFFF' : 'transparent',
        toggle: () => upd(name, on ? 0 : 1),
        dec: () => upd(name, q - 1),
        inc: () => upd(name, q + 1)
      };
    });
    const kinds = Object.keys(sel).length;
    return {
      rows,
      summary: kinds === 0 ? 'Nothing ticked yet' : kinds + (kinds === 1 ? ' item' : ' items') + ' ticked',
      cta: kinds === 0 ? 'Add items' : 'Add ' + kinds + (kinds === 1 ? ' item' : ' items')
    };
  }
}
</script>
</body>
</html>
