<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FridgeWise – Hand over the kitchen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3533;text-decoration-color:#FF7F79;text-decoration-thickness:2px;text-underline-offset:3px}a:hover{color:#000000}
:focus-visible{outline:3px solid #3D3533;outline-offset:3px}
.fw-btn{transition:transform .12s ease, box-shadow .12s ease}
.fw-btn:active{transform:translateY(4px);box-shadow:none !important}
.fw-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width: 900px){.fw-side{display:none !important}}
</style>
</helmet>
<div style="position: relative; box-sizing: border-box; min-height: 100vh; padding: 24px; display: flex; flex-wrap: wrap; gap: 32px; background: #FFF9F0; font-family: 'Nunito', system-ui, sans-serif; color: #3D3533">
  <div class="fw-side" aria-hidden="true" style="flex: 0 0 264px; display: flex">
    <dc-import name="AppSidebar" active="kitchen" hint-size="264px,852px"></dc-import>
  </div>
  <div aria-hidden="true" style="flex: 999 1 560px; min-width: 0; max-width: 1080px; padding: 8px 8px 24px; display: flex; flex-direction: column; gap: 24px">
    <dc-import name="KitchenBar" tab="members" sync="synced" hint-size="100%,150px"></dc-import>
    <div style="display: flex; gap: 24px">
      <div style="flex: 1; height: 480px; border-radius: 24px; background: #FFFFFF"></div>
      <div style="flex: 0 0 340px; height: 480px; border-radius: 24px; background: #FFFFFF"></div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(61, 53, 51, 0.5); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="tr-h" aria-describedby="tr-d" style="width: 100%; max-width: 540px; box-sizing: border-box; padding: 32px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 32px 64px rgba(61, 53, 51, 0.3); display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 18px; background: #FFE28A; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18l3-10 5 5 2-8 2 8 5-5 3 10z"></path></svg>
        </span>
        <h2 id="tr-h" style="margin: 8px 0 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 30px; line-height: 1.1; font-weight: 800">Pick a new owner first</h2>
        <p id="tr-d" style="margin: 0; font-size: 16px; line-height: 1.55; color: #6B6663">You own Room 4B kitchen and 3 people still use it. Choose who takes over before you leave.</p>
      </div>

      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
        <legend class="fw-sr">New owner</legend>
        <label style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; border: 2px solid #3D3533; background: #FFF4F3; cursor: pointer">
          <input type="radio" name="owner" checked="" class="fw-sr">
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #A9D8F0; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">AR</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">Ali Raza</span><span style="font-size: 13px; color: #6B6663">Member since 4 Sep</span></span>
          <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; background: #3D3533; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        </label>
        <label style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; border: 1.5px solid #D9D2CB; background: #FFFFFF; cursor: pointer">
          <input type="radio" name="owner" class="fw-sr">
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #C9B9F2; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">MH</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">Maryam Hussain</span><span style="font-size: 13px; color: #6B6663">Member since 4 Sep</span></span>
          <span aria-hidden="true" style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid #898582"></span>
        </label>
        <label style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; border: 1.5px solid #D9D2CB; background: #FFFFFF; cursor: pointer">
          <input type="radio" name="owner" class="fw-sr">
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #A8DDB5; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">ZA</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">Zain Ahmed</span><span style="font-size: 13px; color: #6B6663">Member since today</span></span>
          <span aria-hidden="true" style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid #898582"></span>
        </label>
      </fieldset>

      <p style="margin: 0; display: flex; gap: 10px; padding: 14px; border-radius: 16px; background: #FFF9F0; font-size: 14px; line-height: 1.5; color: #5C5552">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
        Ali will be able to invite and remove people. We'll let everyone know about the change.
      </p>

      <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px">
        <a href="Members.dc.html" class="fw-btn" style="display: flex; align-items: center; height: 52px; padding: 0 26px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #898582; box-shadow: 0 4px 0 #E3DCD3; font-size: 16px; font-weight: 800; text-decoration: none">Stay</a>
        <a href="JoinKitchen.dc.html" class="fw-btn" style="display: flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 999px; background: #FF7F79; box-shadow: 0 4px 0 #D9524C; font-size: 16px; font-weight: 800; text-decoration: none">Make Ali owner and leave</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
