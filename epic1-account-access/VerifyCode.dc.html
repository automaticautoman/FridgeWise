<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FridgeWise – Enter code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3533;text-decoration-color:#FF7F79;text-decoration-thickness:2px;text-underline-offset:3px}a:hover{color:#000000}
:focus-visible{outline:3px solid #3D3533;outline-offset:3px}
.fw-btn{transition:transform .12s ease, box-shadow .12s ease}
.fw-btn:active{transform:translateY(4px);box-shadow:none !important}
.fw-input:focus{border-color:#3D3533 !important;box-shadow:0 0 0 4px #FFE3E1;outline:none}
@media (max-width: 900px){.fw-aside{display:none !important}}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; background: #FFF9F0; font-family: 'Nunito', system-ui, sans-serif; color: #3D3533">
  <main style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; padding: 8px clamp(0px, 3vw, 40px)">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #FF7F79; box-shadow: 0 3px 0 #D9524C; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M6 10h12"></path><path d="M9.5 5v2"></path><path d="M9.5 13v3"></path></svg>
      </span>
      <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; line-height: 1">FridgeWise</span>
    </div>

    <div style="flex-grow: 1; display: flex; align-items: center; padding: 32px 0">
      <div style="width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column">
        <a href="ForgotPassword.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px 0 10px; margin-left: -10px; border-radius: 999px; font-size: 15px; font-weight: 800; text-decoration: none">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          Back
        </a>

        <div style="margin-top: 24px; width: 72px; height: 72px; border-radius: 24px; background: #A9D8F0; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3.5 7.5l8.5 6 8.5-6"></path></svg>
        </div>

        <h1 style="margin: 24px 0 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">Check your email</h1>
        <p style="margin: 8px 0 0; font-size: 17px; line-height: 1.55; color: #6B6663">If an account exists for <span style="font-weight: 800; color: #3D3533">sara@example.com</span>, we've sent a 6-digit code. It works for 10 minutes.</p>

        <form style="margin: 28px 0 0">
          <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 12px">
            <legend style="padding: 0; margin-bottom: 12px; font-size: 15px; font-weight: 800">Verification code</legend>
            <div style="display: flex; gap: 12px">
              <input class="fw-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1 of 6" value="4" style="width: 56px; height: 64px; box-sizing: border-box; padding: 0; text-align: center; border: 1.5px solid #898582; border-radius: 18px; background: #FFFFFF; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; color: #3D3533">
              <input class="fw-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2 of 6" value="8" style="width: 56px; height: 64px; box-sizing: border-box; padding: 0; text-align: center; border: 1.5px solid #898582; border-radius: 18px; background: #FFFFFF; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; color: #3D3533">
              <input class="fw-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3 of 6" value="2" style="width: 56px; height: 64px; box-sizing: border-box; padding: 0; text-align: center; border: 1.5px solid #898582; border-radius: 18px; background: #FFFFFF; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; color: #3D3533">
              <input class="fw-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4 of 6" value="9" style="width: 56px; height: 64px; box-sizing: border-box; padding: 0; text-align: center; border: 1.5px solid #898582; border-radius: 18px; background: #FFFFFF; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; color: #3D3533">
              <input class="fw-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5 of 6" value="1" style="width: 56px; height: 64px; box-sizing: border-box; padding: 0; text-align: center; border: 1.5px solid #898582; border-radius: 18px; background: #FFFFFF; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; color: #3D3533">
              <input class="fw-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6 of 6" value="3" style="width: 56px; height: 64px; box-sizing: border-box; padding: 0; text-align: center; border: 2px solid #3D3533; box-shadow: 0 0 0 4px #FFE3E1; border-radius: 18px; background: #FFFFFF; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; color: #3D3533">
            </div>
            <p style="margin: 4px 0 0; font-size: 15px; color: #6B6663">Wrong email? <a href="ForgotPassword.dc.html" style="font-weight: 800">Change it</a></p>
          </fieldset>
        </form>

        <div style="margin-top: 24px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 18px; background: #FFF3CC; font-size: 15px; color: #3D3533">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3533" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span>Didn't get it? Check spam, or resend in <span style="font-weight: 800">0:42</span></span>
        </div>

        <a href="NewPassword.dc.html" class="fw-btn" style="margin-top: 28px; display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 999px; background: #FF7F79; box-shadow: 0 4px 0 #D9524C; color: #3D3533; font-size: 17px; font-weight: 800; text-decoration: none">Verify code</a>
      </div>
    </div>
  </main>

  <aside class="fw-aside" style="flex: 1 1 520px; min-width: 0; display: flex">
    <dc-import name="BrandPanel" variant="code" hint-size="100%,852px"></dc-import>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
